server:
  port: ${PORT:8080}

spring:
  application:
    name: mainichi-pos-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:${RAILWAY_TCP_PROXY_DOMAIN:localhost}}}:${DB_PORT:${MYSQLPORT:${RAILWAY_TCP_PROXY_PORT:3306}}}/${DB_NAME:${MYSQLDATABASE:${MYSQL_DATABASE:mainichi_pos}}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:${MYSQLUSER:${MYSQL_USER:root}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:root}}}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.mainichi.pos: DEBUG
    org.springframework.jdbc.core: DEBUG
