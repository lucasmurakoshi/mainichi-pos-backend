server:
  port: 8080

spring:
  application:
    name: mainichi-pos-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mainichi_pos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.mainichi.pos: DEBUG
    org.springframework.jdbc.core: DEBUG
